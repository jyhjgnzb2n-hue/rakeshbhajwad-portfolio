kind = "web"
previewPath = "/"
title = "Rakesh Bhajwad Portfolio"
description = "A premium personal portfolio website for Rakesh Bhajwad — aspiring web developer, AI developer, and cinematic horror content creator. Features a dark glassmorphism design with smooth animations, mobile responsiveness, and sections for hero, about, skills, projects, interests, and contact."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
